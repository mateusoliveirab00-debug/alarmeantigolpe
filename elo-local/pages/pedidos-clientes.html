<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pedidos de clientes</title>
  <meta name="description" content="Pedidos feitos por consumidores na sua loja.">
  <link rel="icon" type="image/svg+xml" href="../img/logo.svg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { prefix: "tw-", corePlugins: { preflight: false } };</script>
  <link href="../css/styles.css" rel="stylesheet">
  <!-- Autenticação: carrega antes da página e bloqueia o acesso de quem não tem permissão -->
  <script src="../js/config.js"></script>
  <script src="../js/auth.js" data-raiz="../" data-acesso="vendedor"></script>
</head>
<body data-raiz="../" data-pagina="clientes" data-titulo="Pedidos de clientes">
  <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>
  <div id="cabecalho"></div>

  <main id="conteudo" class="container py-4">
    <div class="mb-4">
      <p class="text-uppercase small fw-semibold text-primary mb-1">Área do vendedor</p>
      <h1 class="h2 mb-1">Pedidos de clientes</h1>
      <p class="text-secondary mb-0">Pedidos feitos por consumidores na sua loja. Aceite, prepare e conclua.</p>
    </div>

    <section id="resumo" class="tw-grid tw-grid-cols-2 lg:tw-grid-cols-4 tw-gap-3 mb-4" aria-label="Resumo"></section>

    <div class="d-flex flex-wrap gap-2 mb-3" id="filtros" role="group" aria-label="Filtrar por situação">
      <button type="button" class="btn btn-sm btn-outline-primary btn-filtro ativo" data-filtro="todos">Todos</button>
      <button type="button" class="btn btn-sm btn-outline-primary btn-filtro" data-filtro="novo">Novos</button>
      <button type="button" class="btn btn-sm btn-outline-primary btn-filtro" data-filtro="andamento">Em andamento</button>
      <button type="button" class="btn btn-sm btn-outline-primary btn-filtro" data-filtro="concluido">Concluídos</button>
      <button type="button" class="btn btn-sm btn-outline-primary btn-filtro" data-filtro="encerrado">Recusados/cancelados</button>
    </div>

    <div class="card-el">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead>
            <tr>
              <th scope="col">Nº</th>
              <th scope="col">Cliente</th>
              <th scope="col">Itens</th>
              <th scope="col" class="text-end">Total est.</th>
              <th scope="col">Receber</th>
              <th scope="col">Status</th>
              <th scope="col" class="text-end">Ações</th>
            </tr>
          </thead>
          <tbody id="corpoTabela"></tbody>
        </table>
      </div>
    </div>
    <p class="fonte-dado mt-2">Os pedidos ficam salvos neste navegador. O total é uma estimativa com preços de referência.</p>
  </main>

  <div id="rodape"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/pedidos-loja.js"></script>
  <script src="../js/pedidos-clientes.js"></script>
</body>
</html>
