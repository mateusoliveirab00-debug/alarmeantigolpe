<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recuperar senha</title>
  <meta name="description" content="Recupere o acesso à sua conta.">
  <link rel="icon" type="image/svg+xml" href="../img/logo.svg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { prefix: "tw-", corePlugins: { preflight: false } };</script>
  <link href="../css/styles.css" rel="stylesheet">
  <script src="../js/config.js"></script>
  <script src="../js/auth.js" data-raiz="../" data-acesso="visitante"></script>
</head>
<body data-raiz="../" data-pagina="recuperar" data-titulo="Recuperar senha">
  <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>
  <div id="cabecalho"></div>

  <main id="conteudo" class="container py-4 py-lg-5">
    <div class="auth-cartao auth-estreito">
      <section class="auth-formulario" aria-labelledby="tituloRec">
        <h1 id="tituloRec" class="h3 mb-1">Esqueci minha senha</h1>
        <p class="text-secondary mb-4">Informe o e-mail da conta para receber um código de 6 números.</p>

        <!-- Passo 1: pedir o código -->
        <form id="formRec1" data-modo="recuperar1" novalidate>
          <div class="alert d-none" role="alert" data-alerta></div>
          <div class="mb-4">
            <label for="emailRec" class="form-label fw-semibold">E-mail da conta</label>
            <input type="email" class="form-control" id="emailRec" name="email" data-validar="email"
                   placeholder="seunome@gmail.com" autocomplete="email" inputmode="email" aria-describedby="emailRecErro" required>
            <div class="invalid-feedback" id="emailRecErro"></div>
          </div>
          <button type="submit" class="btn btn-primary btn-lg w-100" id="btnEnviar" data-enviar>
            <span class="rotulo"><i class="bi bi-envelope me-2"></i>Enviar código</span>
            <span class="carregando d-none"><span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>Enviando…</span>
          </button>
        </form>

        <!-- Passo 2: código + nova senha -->
        <div id="passo2" hidden>
          <div class="caixa-email-simulado mb-4" id="caixaEmail" aria-live="polite"></div>
          <form id="formRec2" data-modo="recuperar2" novalidate>
            <div class="alert d-none" role="alert" data-alerta></div>
            <input type="hidden" name="email" id="emailPasso2">
            <div class="row g-3 mb-4">
              <div class="col-12">
                <label for="codigo" class="form-label fw-semibold">Código recebido</label>
                <input type="text" class="form-control" id="codigo" name="codigo" data-validar="codigo" data-mascara="codigo"
                       placeholder="123456" inputmode="numeric" autocomplete="one-time-code" aria-describedby="codigoErro" required>
                <div class="invalid-feedback" id="codigoErro"></div>
              </div>
          <div class="col-md-6">
            <label for="senha" class="form-label fw-semibold">Nova senha</label>
            <div class="input-group">
              <input type="password" class="form-control" id="senha" name="senha" data-validar="senha"
                     placeholder="Mínimo de 8 caracteres" autocomplete="new-password" aria-describedby="senhaErro" required>
              <button class="btn btn-outline-secondary" type="button" data-alternar-senha="senha" aria-label="Mostrar senha" aria-pressed="false"><i class="bi bi-eye"></i></button>
            </div>
            <div class="invalid-feedback" id="senhaErro"></div>
            <ul class="requisitos-senha list-unstyled small mb-0 mt-2" data-requisitos>
              <li data-req="len"><i class="bi bi-circle"></i> Pelo menos 8 caracteres</li>
              <li data-req="letra"><i class="bi bi-circle"></i> Uma letra</li>
              <li data-req="num"><i class="bi bi-circle"></i> Um número</li>
            </ul>
          </div>
          <div class="col-md-6">
            <label for="confirmar" class="form-label fw-semibold">Repita a senha</label>
            <div class="input-group">
              <input type="password" class="form-control" id="confirmar" name="confirmar" data-validar="confirmar"
                     placeholder="Digite a senha novamente" autocomplete="new-password" aria-describedby="confirmarErro" required>
              <button class="btn btn-outline-secondary" type="button" data-alternar-senha="confirmar" aria-label="Mostrar senha" aria-pressed="false"><i class="bi bi-eye"></i></button>
            </div>
            <div class="invalid-feedback" id="confirmarErro"></div>
          </div>
            </div>
            <button type="submit" class="btn btn-primary btn-lg w-100" id="btnEnviar" data-enviar>
            <span class="rotulo"><i class="bi bi-key me-2"></i>Redefinir senha</span>
            <span class="carregando d-none"><span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>Salvando…</span>
          </button>
          </form>
        </div>

        <p class="text-center text-secondary mt-4 mb-0"><a href="login.html" class="fw-semibold"><i class="bi bi-arrow-left me-1"></i>Voltar para entrar</a></p>
      </section>
    </div>
  </main>

  <div id="rodape"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/autenticacao.js"></script>
  <script>
    // Passo 1 concluído: mostra o "e-mail" simulado e o formulário da nova senha
    document.addEventListener("recuperar:codigo", function (e) {
      document.getElementById("formRec1").hidden = true;
      document.getElementById("passo2").hidden = false;
      document.getElementById("emailPasso2").value = e.detail.email;
      document.getElementById("caixaEmail").innerHTML = e.detail.codigo
        ? '<div class="small text-uppercase fw-semibold mb-1"><i class="bi bi-envelope-open me-1"></i>E-mail simulado</div>' +
          'Seu código de recuperação é <strong class="codigo-simulado">' + e.detail.codigo + '</strong> (vale por 10 minutos).' +
          '<div class="small mt-1">No protótipo nenhum e-mail é enviado de verdade; o código aparece aqui.</div>'
        : '<div class="small text-uppercase fw-semibold mb-1"><i class="bi bi-envelope-open me-1"></i>E-mail simulado</div>' +
          'Se existir uma conta com este e-mail, enviamos um código. Confira sua caixa de entrada.' +
          '<div class="small mt-1">Protótipo: não existe conta com este e-mail, por isso nenhum código foi gerado.</div>';
      document.getElementById("codigo").focus();
    });
  </script>
</body>
</html>
