<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Minha conta</title>
  <meta name="description" content="Atualize seus dados e sua senha.">
  <link rel="icon" type="image/svg+xml" href="../img/logo.svg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { prefix: "tw-", corePlugins: { preflight: false } };</script>
  <link href="../css/styles.css" rel="stylesheet">
  <script src="../js/config.js"></script>
  <script src="../js/auth.js" data-raiz="../" data-acesso="logado"></script>
</head>
<body data-raiz="../" data-pagina="perfil" data-titulo="Minha conta">
  <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>
  <div id="cabecalho"></div>

  <main id="conteudo" class="container py-4" style="max-width: 860px;">
    <div class="mb-4">
      <p class="text-uppercase small fw-semibold text-primary mb-1">Minha conta</p>
      <h1 class="h2 mb-1">Meus dados</h1>
      <p class="text-secondary mb-0">Atualize seu cadastro e troque a senha quando quiser.</p>
    </div>

    <!-- Verificação da empresa (só vendedor) -->
    <section class="card-el p-4 mb-4" id="painelVerificacao" hidden aria-labelledby="tituloVerif"></section>

    <section class="card-el p-4 mb-4" aria-labelledby="tituloDados">
      <h2 id="tituloDados" class="h5 mb-3">Dados da conta</h2>
      <form id="formPerfil" data-modo="perfil" novalidate>
        <div class="alert d-none" role="alert" data-alerta></div>
        <fieldset class="mb-4">
          <legend class="auth-secao"><i class="bi bi-person-circle me-2"></i>Seus dados</legend>
          <div class="row g-3">
          <div class="col-12">
            <label for="nome" class="form-label fw-semibold"><span data-texto-consumidor="Nome completo" data-texto-vendedor="Nome do responsável">Nome completo</span></label>
            <input type="text" class="form-control" id="nome" name="nome" data-validar="nome" placeholder="Maria da Silva" autocomplete="name" aria-describedby="nomeErro" required>
            <div class="invalid-feedback" id="nomeErro"></div>
          </div>
          <div class="col-md-7">
            <label for="email" class="form-label fw-semibold">E-mail</label>
            <input type="email" class="form-control" id="email" name="email" data-validar="email" placeholder="seunome@gmail.com" autocomplete="email" inputmode="email" aria-describedby="emailErro" required>
            <div class="invalid-feedback" id="emailErro"></div>
          </div>
          <div class="col-md-5">
            <label for="telefone" class="form-label fw-semibold">Celular</label>
            <input type="tel" class="form-control" id="telefone" name="telefone" data-validar="telefone" data-mascara="telefone" placeholder="(92) 91234-5678" inputmode="numeric" aria-describedby="telefoneErro" required>
            <div class="invalid-feedback" id="telefoneErro"></div>
          </div>
          </div>
        </fieldset>
        <fieldset class="mb-4" data-bloco-empresa hidden disabled>
            <legend class="auth-secao"><i class="bi bi-building me-2"></i>Dados da empresa</legend>
            <div class="row g-3">
              <div class="col-md-7">
                <label for="razaoSocial" class="form-label fw-semibold">Razão social</label>
                <input type="text" class="form-control" id="razaoSocial" name="razaoSocial" data-validar="obrigatorio"
                       data-rotulo="a razão social" data-min="3" placeholder="Lima Comércio de Alimentos Ltda"
                       autocomplete="organization" aria-describedby="razaoSocialErro" required>
                <div class="invalid-feedback" id="razaoSocialErro"></div>
              </div>
              <div class="col-md-5">
                <label for="nomeFantasia" class="form-label fw-semibold">Nome fantasia</label>
                <input type="text" class="form-control" id="nomeFantasia" name="nomeFantasia" data-validar="obrigatorio"
                       data-rotulo="o nome fantasia" placeholder="Mercadinho da Graça" aria-describedby="nomeFantasiaErro" required>
                <div class="invalid-feedback" id="nomeFantasiaErro"></div>
              </div>
              <div class="col-md-4">
                <label for="cnpj" class="form-label fw-semibold">CNPJ</label>
                <input type="text" class="form-control" id="cnpj" name="cnpj" data-validar="cnpj" data-mascara="cnpj"
                       placeholder="11.222.333/0001-81" inputmode="numeric" aria-describedby="cnpjErro" required>
                <div class="invalid-feedback" id="cnpjErro"></div>
              </div>
              <div class="col-md-4">
                <label for="categoria" class="form-label fw-semibold">Categoria do negócio</label>
                <select class="form-select" id="categoria" name="categoria" data-validar="categoria" aria-describedby="categoriaErro" required>
                  <option value="">Selecione…</option>
                  <option value="mercearia">Mercearia / mercadinho</option>
                  <option value="hortifruti">Hortifruti / feira</option>
                  <option value="padaria">Padaria / confeitaria</option>
                  <option value="acougue">Açougue / peixaria</option>
                  <option value="bebidas">Bebidas / conveniência</option>
                  <option value="atacado">Atacado / distribuidor</option>
                  <option value="outro">Outro</option>
                </select>
                <div class="invalid-feedback" id="categoriaErro"></div>
              </div>
              <div class="col-md-4">
                <label for="telefoneEmpresa" class="form-label fw-semibold">Telefone da empresa</label>
                <input type="tel" class="form-control" id="telefoneEmpresa" name="telefoneEmpresa" data-validar="telefone" data-mascara="telefone"
                       placeholder="(92) 3234-5678" inputmode="numeric" aria-describedby="telefoneEmpresaErro" required>
                <div class="invalid-feedback" id="telefoneEmpresaErro"></div>
              </div>

              <div class="col-md-4">
                <label for="cep" class="form-label fw-semibold">CEP</label>
                <input type="text" class="form-control" id="cep" name="cep" data-validar="cep" data-mascara="cep"
                       placeholder="69010-000" autocomplete="postal-code" inputmode="numeric" aria-describedby="cepErro" required>
                <div class="invalid-feedback" id="cepErro"></div>
                <div class="form-text" id="cepStatus">Preenchemos o endereço pelo CEP.</div>
              </div>
              <div class="col-md-5">
                <label for="endereco" class="form-label fw-semibold">Endereço</label>
                <input type="text" class="form-control" id="endereco" name="endereco" data-validar="obrigatorio"
                       data-rotulo="o endereço" data-min="3" placeholder="Rua Costa Azevedo" autocomplete="address-line1"
                       aria-describedby="enderecoErro" required>
                <div class="invalid-feedback" id="enderecoErro"></div>
              </div>
              <div class="col-md-3">
                <label for="numero" class="form-label fw-semibold">Número</label>
                <input type="text" class="form-control" id="numero" name="numero" data-validar="obrigatorio"
                       data-rotulo="o número" data-min="1" placeholder="120 ou s/n" aria-describedby="numeroErro" required>
                <div class="invalid-feedback" id="numeroErro"></div>
              </div>
              <div class="col-md-4">
                <label for="bairro" class="form-label fw-semibold">Bairro</label>
                <input type="text" class="form-control" id="bairro" name="bairro" data-validar="obrigatorio"
                       data-rotulo="o bairro" placeholder="Centro" aria-describedby="bairroErro" required>
                <div class="invalid-feedback" id="bairroErro"></div>
              </div>
              <div class="col-md-5">
                <label for="cidade" class="form-label fw-semibold">Cidade</label>
                <input type="text" class="form-control" id="cidade" name="cidade" data-validar="obrigatorio"
                       data-rotulo="a cidade" placeholder="Manaus" autocomplete="address-level2" aria-describedby="cidadeErro" required>
                <div class="invalid-feedback" id="cidadeErro"></div>
              </div>
              <div class="col-md-3">
                <label for="uf" class="form-label fw-semibold">Estado</label>
                <select class="form-select" id="uf" name="uf" data-validar="uf" aria-describedby="ufErro" required>
                  <option value="">UF</option>
                  <option>AC</option><option>AL</option><option>AP</option><option>AM</option><option>BA</option>
                  <option>CE</option><option>DF</option><option>ES</option><option>GO</option><option>MA</option>
                  <option>MT</option><option>MS</option><option>MG</option><option>PA</option><option>PB</option>
                  <option>PR</option><option>PE</option><option>PI</option><option>RJ</option><option>RN</option>
                  <option>RS</option><option>RO</option><option>RR</option><option>SC</option><option>SP</option>
                  <option>SE</option><option>TO</option>
                </select>
                <div class="invalid-feedback" id="ufErro"></div>
              </div>
            </div>
          </fieldset>
        <button type="submit" class="btn btn-primary" id="btnEnviar" data-enviar>
          <span class="rotulo"><i class="bi bi-check2-circle me-2"></i>Salvar alterações</span>
          <span class="carregando d-none"><span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>Salvando…</span>
        </button>
      </form>
    </section>

    <section class="card-el p-4" aria-labelledby="tituloSenha">
      <h2 id="tituloSenha" class="h5 mb-3">Alterar senha</h2>
      <form id="formSenha" data-modo="senha" novalidate>
        <div class="alert d-none" role="alert" data-alerta></div>
        <div class="row g-3 mb-4">
          <div class="col-12">
            <label for="senhaAtual" class="form-label fw-semibold">Senha atual</label>
            <div class="input-group">
              <input type="password" class="form-control" id="senhaAtual" name="senhaAtual" data-validar="senhaLogin"
                     placeholder="Sua senha de hoje" autocomplete="current-password" aria-describedby="senhaAtualErro" required>
              <button class="btn btn-outline-secondary" type="button" data-alternar-senha="senhaAtual" aria-label="Mostrar senha" aria-pressed="false"><i class="bi bi-eye"></i></button>
            </div>
            <div class="invalid-feedback" id="senhaAtualErro"></div>
          </div>
          <div class="col-md-6">
            <label for="senha" class="form-label fw-semibold">Nova senha</label>
            <div class="input-group">
              <input type="password" class="form-control" id="senha" name="senha" data-validar="senha"
                     placeholder="Mínimo de 8 caracteres" autocomplete="new-password" aria-describedby="senhaErro" required>
              <button class="btn btn-outline-secondary" type="button" data-alternar-senha="senha" aria-label="Mostrar senha" aria-pressed="false"><i class="bi bi-eye"></i></button>
            </div>
            <div class="invalid-feedback" id="senhaErro"></div>
            <ul class="requisitos-senha list-unstyled small mb-0 mt-2" data-requisitos>
              <li data-req="len"><i class="bi bi-circle"></i> Pelo menos 8 caracteres</li>
              <li data-req="letra"><i class="bi bi-circle"></i> Uma letra</li>
              <li data-req="num"><i class="bi bi-circle"></i> Um número</li>
            </ul>
          </div>
          <div class="col-md-6">
            <label for="confirmar" class="form-label fw-semibold">Repita a senha</label>
            <div class="input-group">
              <input type="password" class="form-control" id="confirmar" name="confirmar" data-validar="confirmar"
                     placeholder="Digite a senha novamente" autocomplete="new-password" aria-describedby="confirmarErro" required>
              <button class="btn btn-outline-secondary" type="button" data-alternar-senha="confirmar" aria-label="Mostrar senha" aria-pressed="false"><i class="bi bi-eye"></i></button>
            </div>
            <div class="invalid-feedback" id="confirmarErro"></div>
          </div>
        </div>
        <button type="submit" class="btn btn-primary" data-enviar>
          <span class="rotulo"><i class="bi bi-key me-2"></i>Alterar senha</span>
          <span class="carregando d-none"><span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>Salvando…</span>
        </button>
      </form>
    </section>
  </main>

  <div id="rodape"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/autenticacao.js"></script>
  <script src="../js/perfil.js"></script>
</body>
</html>
