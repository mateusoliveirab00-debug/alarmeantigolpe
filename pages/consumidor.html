<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Área do consumidor</title>
  <meta name="description" content="Compare preço e disponibilidade de produtos básicos nos comércios do seu bairro.">
  <link rel="icon" type="image/svg+xml" href="../img/logo.svg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { prefix: "tw-", corePlugins: { preflight: false } };</script>
  <link href="../css/styles.css" rel="stylesheet">
</head>
<body data-raiz="../" data-pagina="consumidor" data-titulo="Área do consumidor">
  <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>
  <div id="cabecalho"></div>

  <main id="conteudo" class="container py-4">
    <div class="mb-4">
      <p class="text-uppercase small fw-semibold text-primary mb-1">Área do consumidor</p>
      <h1 class="h2 mb-1">Onde comprar perto de você</h1>
      <p class="text-secondary mb-0">Compare preço e disponibilidade nos comércios do seu bairro e valorize o comércio local.</p>
    </div>

    <div class="aviso-exemplo mb-4">
      <i class="bi bi-info-circle me-1"></i>
      Comércios, preços e estoques são <strong>fictícios, apenas de exemplo</strong>.
    </div>

    <!-- Filtros -->
    <section class="card-el p-4 mb-4" aria-label="Filtros">
      <form id="filtros" class="row g-3 align-items-end" onsubmit="return false">
        <div class="col-md-4">
          <label for="fProduto" class="form-label fw-semibold">Produto</label>
          <select id="fProduto" class="form-select"></select>
        </div>
        <div class="col-md-3">
          <label for="fBairro" class="form-label fw-semibold">Bairro</label>
          <select id="fBairro" class="form-select"></select>
        </div>
        <div class="col-md-3">
          <label for="fOrdem" class="form-label fw-semibold">Ordenar por</label>
          <select id="fOrdem" class="form-select">
            <option value="preco">Menor preço</option>
            <option value="nome">Nome do comércio</option>
          </select>
        </div>
        <div class="col-md-2">
          <label for="fTipo" class="form-label fw-semibold">Tipo</label>
          <select id="fTipo" class="form-select">
            <option value="todos">Todos</option>
            <option value="pequeno">Pequeno comércio</option>
            <option value="grande">Grande rede</option>
          </select>
        </div>
        <div class="col-12 d-flex flex-wrap gap-4">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="fEstoque">
            <label class="form-check-label" for="fEstoque">Mostrar só com estoque</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="fFavoritos">
            <label class="form-check-label" for="fFavoritos">Mostrar só favoritos <span id="contadorFavoritos" class="text-secondary"></span></label>
          </div>
        </div>
      </form>
    </section>

    <!-- Comparação entre pequeno comércio e grande rede -->
    <section id="comparacaoTipos" class="mb-4" aria-live="polite"></section>

    <!-- Resultados -->
    <section aria-labelledby="tituloResultados">
      <h2 id="tituloResultados" class="h5 mb-3">Resultados <span id="contadorResultados" class="text-secondary fs-6"></span></h2>
      <div id="resultados" class="tw-grid tw-gap-4 md:tw-grid-cols-2 xl:tw-grid-cols-3"></div>
    </section>
  </main>

  <div id="rodape"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/dados.js"></script>
  <script src="../js/consumidor.js"></script>
</body>
</html>
